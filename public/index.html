<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Study Quiz Automation</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Study Quiz Automation</p>
        <h1>学習メモ</h1>
      </div>
      <div class="header-actions">
        <a class="nav-button" href="/quizzes.html">クイズに回答</a>
        <button class="icon-button" id="refresh-button" type="button" aria-label="再読み込み" title="再読み込み">
          ↻
        </button>
      </div>
    </header>

    <main class="memo-workspace">
      <section class="topic-pane" aria-labelledby="topic-heading">
        <div class="section-heading">
          <div>
            <h2 id="topic-heading">学習メモ</h2>
            <p id="topic-count">0件</p>
          </div>
        </div>

        <form id="topic-form" class="topic-form">
          <input type="hidden" id="topic-id">

          <label>
            学習対象
            <input id="target" name="target" type="text" maxlength="160" required placeholder="HTML、セキュリティなど">
          </label>

          <div class="form-grid">
            <label>
              優先度
              <select id="priority" name="priority">
                <option value="high">高</option>
                <option value="normal" selected>中</option>
                <option value="low">低</option>
              </select>
            </label>

            <label>
              状態
              <select id="status" name="status">
                <option value="active" selected>学習中</option>
                <option value="paused">保留</option>
                <option value="archived">完了</option>
              </select>
            </label>
          </div>

          <label>
            補足
            <textarea id="note" name="note" maxlength="4000" rows="5" placeholder="特に学びたい観点、試験名、苦手なところなど"></textarea>
          </label>

          <div class="form-actions">
            <button id="save-topic-button" class="primary-button" type="submit">保存</button>
            <button id="cancel-edit-button" class="secondary-button" type="button" hidden>キャンセル</button>
          </div>
        </form>

        <div id="topic-error" class="message error" hidden></div>
        <div id="topic-list" class="topic-list" aria-live="polite"></div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
